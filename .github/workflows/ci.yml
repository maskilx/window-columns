name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version

      # Includes release metadata, the full Swift build, and pure core checks.
      # Runtime checks need a real window server and Accessibility permission.
      - name: Verify
        run: make verify

      - name: Package the app
        run: make app
